spring.application.name=Grafana-Management

# --------------------
# Server Settings
# --------------------
server.port=8081

# --------------------
# Logging Settings
# --------------------
logging.level.root=INFO
logging.level.org.springframework.web=INFO
# your package logs
logging.level.com.example=DEBUG   
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# --------------------
# CORS Settings (fallback if CorsConfig is missing)
# --------------------
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
spring.web.cors.allow-credentials=true

# --------------------
# Custom External API (Grafana)
# --------------------


grafana.base.url=http://localhost:3000
grafana.admin.username=admin
grafana.admin.password=shan1234
grafana.admin.url=http://admin:admin@localhost:3000

# --------------------
# Local DB Config (Postgres)
# --------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/angular_project_database
spring.datasource.username=postgres
spring.datasource.password=shan1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
