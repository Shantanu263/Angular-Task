<div class="flex flex-col min-h-screen bg-gray-100">
  <div class="flex items-center justify-center flex-grow">
    <div class="relative flex flex-col m-6 space-y-8 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0">
    <!-- left side -->
    <div class="flex flex-col justify-center p-8 md:p-14">
      <span class="mb-3 text-4xl font-bold">{{ title() }}</span>
      <span class="font-light text-gray-400 mb-8">
        Please enter your details to continue
      </span>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <app-input 
          [label]="'Email'"
          [type]="'email'"
          [placeholder]="'Enter your email'"
          [control]="loginForm.controls.email"
        />
        
        <app-input
          [label]="'Password'"
          [type]="'password'"
          [placeholder]="'Enter your password'"
          [control]="loginForm.controls.password"
        />
        <div class="flex justify-between w-full py-4">
          <div class="mr-24">
            <input type="checkbox" name="ch" id="ch" class="mr-2" />
            <span class="text-md">Remember Me</span>
          </div>
          <span class="font-bold text-md">Forgot password</span>
        </div>
        <button
          type="submit"
          class="w-full bg-black text-white p-2 rounded-lg mb-6 hover:bg-white hover:text-black hover:border hover:border-gray-300"
        >
          Sign in
        </button>
        <button
          type="button"
          class="w-full border border-gray-300 text-md p-2 rounded-lg mb-6 hover:bg-black hover:text-white"
        >
          <img src="/google.svg" class="w-6 h-6 inline mr-2" alt="Google logo" />
          Sign in with Google
        </button>
        <div class="text-center text-gray-400">
          Don't have an account?
          <a routerLink="/signup" class="font-bold text-black cursor-pointer">Sign up for free</a>
        </div>
      </form>
    </div>
    <!-- right side -->
    <div class="relative">
      <img
        src="images4.jpg"
        alt="Login illustration"
        class="w-[400px] h-full hidden rounded-r-2xl md:block object-cover"
      />
    </div>
    </div>
  </div>
  <app-footer />
</div>
